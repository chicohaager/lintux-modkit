name: installers
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: generated installers match install.sh
        run: bash tools/gen-installers.sh && git diff --exit-code -- install-with-firewall.sh install-without-firewall.sh
      # The same shellcheck as on the development machine: the runner's
      # preinstalled one reported SC2015 in a line 0.11.0 passes (2026-10-17).
      - name: shellcheck 0.11.0
        run: |
          curl -fsSL -o /tmp/sc.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/sc.tar.xz" | sha256sum -c -
          tar xJf /tmp/sc.tar.xz -C /tmp
          sudo install -m 0755 /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version
      - name: shellcheck
        run: shellcheck -x install.sh install-with-firewall.sh install-without-firewall.sh tools/gen-installers.sh tools/test-semver.sh tools/test-tailnet.sh tools/test-decisions.sh tools/test-sysext.sh sysext/build-sysext.sh sysext/lint-units.sh sysext/uninstall-watchdog.sh sysext/unit-watchdog.sh sysext/bundle-debian.sh tools/test-unit-watchdog.sh sysext/add-web.sh
      - name: version comparison (semver_lt)
        run: bash tools/test-semver.sh
      - name: tailnet SSH guard (tailnet_ssh)
        run: bash tools/test-tailnet.sh
      - name: what a run installs (decisions)
        run: bash tools/test-decisions.sh
      - name: sysext lint and build (build-sysext.sh, lint-units.sh)
        run: |
          sudo apt-get update && sudo apt-get install -y squashfs-tools
          bash tools/test-sysext.sh
      - name: sysext unit watchdog (unit-watchdog.sh)
        run: bash tools/test-unit-watchdog.sh
